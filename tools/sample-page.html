<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font: 15px/1.6 "Segoe UI", sans-serif; }
  #screen { position: absolute; inset: 0 0 48px 0; display: flex; flex-direction: column; }
  #taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: #1f2229; display: flex; align-items: center; justify-content: center; gap: 10px; }
  #taskbar i { width: 30px; height: 30px; border-radius: 7px; background: #3a3f4b; display: block; }
  #taskbar i.on { background: #4f7bd9; }
  #clock { position: absolute; right: 18px; color: #d8dbe2; font-size: 12px; text-align: right; line-height: 1.35; }
  pre { margin: 0; font: 15px/1.65 Consolas, monospace; white-space: pre; }
  .eq { text-align: center; margin: 14px 0; font-size: 20px; }
  .eq .katex-display { margin: 0; }
  p { margin: 8px 0; }

  /* PDF viewer */
  .pdf { background: #3b3e44; }
  .pdf .bar { height: 46px; background: #2a2c31; color: #e6e7ea; display: flex; align-items: center; padding: 0 18px; gap: 26px; font-size: 14px; flex: none; }
  .pdf .bar .mid { margin: 0 auto; color: #b9bcc3; }
  .pdf .scroll { flex: 1; overflow: hidden; display: flex; justify-content: center; padding-top: 22px; }
  .pdf .page { width: 860px; background: #fff; color: #1d1d1d; padding: 56px 72px; font: 16px/1.6 Georgia, "Times New Roman", serif; box-shadow: 0 4px 18px rgba(0,0,0,.45); }
  .pdf h1 { font-size: 25px; margin: 0 0 2px; } .pdf h2 { font-size: 18px; margin: 20px 0 4px; }
  .pdf pre { background: #f3f1ea; padding: 12px 16px; border-radius: 4px; display: inline-block; }
  .pdf .meta { color: #666; font-size: 14px; }

  /* Browser + course site */
  .browser { background: #fff; }
  .browser .tabs { height: 40px; background: #dfe3ea; display: flex; align-items: flex-end; padding: 0 10px; gap: 4px; flex: none; }
  .browser .tab { background: #c9ced8; border-radius: 8px 8px 0 0; padding: 8px 16px; font-size: 13px; color: #333; width: 220px; white-space: nowrap; overflow: hidden; }
  .browser .tab.on { background: #fff; }
  .browser .url { height: 42px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #e3e5ea; flex: none; }
  .browser .url span { background: #eef0f4; border-radius: 16px; padding: 6px 16px; font-size: 14px; color: #444; width: 640px; }
  .browser .site { flex: 1; display: flex; overflow: hidden; }
  .browser .nav { width: 250px; background: #f6f7f9; border-right: 1px solid #e3e5ea; padding: 22px 20px; font-size: 14px; color: #3b4150; flex: none; }
  .browser .nav b { display: block; margin: 12px 0 6px; color: #111; } .browser .nav div { padding: 3px 0; }
  .browser .main { padding: 26px 48px; max-width: 900px; color: #222; }
  .browser .crumb { color: #6b7280; font-size: 13px; } .browser h1 { font-size: 26px; margin: 6px 0 10px; } .browser h2 { font-size: 19px; margin: 18px 0 4px; }
  .browser pre { background: #0f172a; color: #e2e8f0; padding: 14px 18px; border-radius: 8px; display: inline-block; }

  /* Slides */
  .slides { background: #23252a; }
  .slides .bar { height: 40px; background: #1a1c20; color: #cfd2d8; display: flex; align-items: center; padding: 0 16px; gap: 22px; font-size: 13px; flex: none; }
  .slides .body { flex: 1; display: flex; overflow: hidden; }
  .slides .thumbs { width: 190px; padding: 16px; display: flex; flex-direction: column; gap: 12px; flex: none; }
  .slides .thumbs i { display: block; height: 88px; background: #3a3d44; border-radius: 3px; } .slides .thumbs i.on { outline: 2px solid #e8a33d; }
  .slides .stagewrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  .slides .slide { width: 1380px; height: 776px; background: #fff; padding: 52px 70px; color: #1b1f2a; position: relative; }
  .slides h1 { font-size: 40px; margin: 0 0 18px; color: #12355b; } .slides .eq { font-size: 30px; }
  .slides pre { font-size: 19px; background: #f4f6fa; padding: 16px 22px; border-radius: 6px; display: inline-block; }
  .slides p { font-size: 22px; } .slides .foot { position: absolute; bottom: 20px; right: 34px; color: #999; font-size: 14px; }

  /* Notebook */
  .notebook { background: #fff; }
  .notebook .bar { height: 44px; background: #f2f2f2; border-bottom: 1px solid #ddd; display: flex; align-items: center; padding: 0 18px; gap: 20px; font-size: 14px; color: #333; flex: none; }
  .notebook .bar b { margin-right: 20px; }
  .notebook .cells { flex: 1; overflow: hidden; padding: 18px 0 0 0; width: 1100px; margin: 0 auto; }
  .notebook .cell { display: flex; margin: 10px 0; } .notebook .cell .in { width: 86px; color: #303f9f; font: 13px Consolas, monospace; padding-top: 10px; flex: none; }
  .notebook .cell .src { flex: 1; } .notebook .md { padding: 4px 8px; color: #222; } .notebook h2 { font-size: 22px; margin: 6px 0; }
  .notebook pre { background: #f7f7f7; border: 1px solid #e0e0e0; padding: 10px 14px; display: block; }
  .notebook .out { font: 14px Consolas, monospace; color: #444; padding: 6px 14px; }
</style>
<div id="screen"></div>
<div id="taskbar"><i></i><i></i><i class="on"></i><i></i><i></i><i></i><div id="clock">10:42 AM<br>10/10/2026</div></div>
<script src="../node_modules/katex/dist/katex.min.js"></script>
<script>
// Builds one fake study screen from a spec, and reports the true box of every piece with an id.
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
function block(b) {
  if (b.h1) return `<h1>${b.h1}</h1>`;
  if (b.h) return `<h2>${b.h}</h2>`;
  if (b.p) return `<p>${b.p}</p>`;
  if (b.meta) return `<p class="meta">${b.meta}</p>`;
  if (b.eq) return `<div class="eq" data-piece="${b.id || ''}" data-tex="${encodeURIComponent(b.eq)}"></div>`;
  if (b.code) return `<pre data-piece="${b.id || ''}">${esc(b.code)}</pre>`;
  if (b.cell) return `<div class="cell"><div class="in">In [${b.n}]:</div><div class="src"><pre data-piece="${b.id || ''}">${esc(b.cell)}</pre>${b.out ? `<div class="out">${esc(b.out)}</div>` : ''}</div></div>`;
  if (b.md) return `<div class="cell"><div class="in"></div><div class="src md">${b.md.map(block).join('')}</div></div>`;
  return '';
}
window.build = (spec) => {
  const s = document.getElementById('screen'), body = spec.blocks.map(block).join('');
  if (spec.chrome === 'pdf') { s.className = 'pdf'; s.innerHTML = `<div class="bar"><span>${spec.file}</span><span class="mid">${spec.page || '3 / 12'}</span><span>− 100% +</span></div><div class="scroll"><div class="page">${body}</div></div>`; }
  if (spec.chrome === 'browser') { s.className = 'browser'; s.innerHTML = `<div class="tabs"><div class="tab">Inbox (3)</div><div class="tab on">${spec.tab}</div><div class="tab">Assignment 4</div></div><div class="url"><span>${spec.url}</span></div>
    <div class="site"><div class="nav"><b>${spec.course}</b><div>Home</div><div>Syllabus</div><div>Announcements</div><b>Modules</b>${(spec.nav || []).map(n => `<div>${n}</div>`).join('')}<b>Help</b><div>Office hours</div><div>Discussion board</div></div><div class="main">${body}</div></div>`; }
  if (spec.chrome === 'slides') { s.className = 'slides'; s.innerHTML = `<div class="bar"><span>${spec.file}</span><span>Slide Show</span><span>View</span></div><div class="body"><div class="thumbs"><i></i><i></i><i class="on"></i><i></i><i></i><i></i></div><div class="stagewrap"><div class="slide">${body}<div class="foot">${spec.foot || ''}</div></div></div></div>`; }
  if (spec.chrome === 'notebook') { s.className = 'notebook'; s.innerHTML = `<div class="bar"><b>${spec.file}</b><span>File</span><span>Edit</span><span>View</span><span>Run</span><span>Kernel</span><span>Help</span></div><div class="cells">${body}</div>`; }
  for (const e of document.querySelectorAll('[data-tex]')) katex.render(decodeURIComponent(e.dataset.tex), e, { displayMode: true, throwOnError: true });
  return document.fonts.ready.then(() => [...document.querySelectorAll('[data-piece]')].filter(e => e.dataset.piece).map(e => {
    // An equation's wrapper is as wide as the column, so measure the union of its glyph runs instead.
    // Same idea as box() in stage.html: every leaf element that draws a character.
    const leaves = (el) => [...el.querySelectorAll('.katex-html *')].filter((s) => s.childElementCount === 0 && s.textContent.trim());
    const rs = (e.matches('.eq') ? leaves(e).map((b) => b.getBoundingClientRect()) : [e.getBoundingClientRect()]).filter((q) => q.width > 0);
    if (!rs.length) throw new Error('no visible glyphs in piece ' + e.dataset.piece);
    const x0 = Math.min(...rs.map((q) => q.left)), y0 = Math.min(...rs.map((q) => q.top)), x1 = Math.max(...rs.map((q) => q.right)), y1 = Math.max(...rs.map((q) => q.bottom));
    const r = { x: x0, y: y0, width: x1 - x0, height: y1 - y0 }, k = devicePixelRatio, px = (q) => [q.x, q.y, q.width, q.height].map((v) => Math.round(v * k));
    const piece = { id: e.dataset.piece, kind: e.matches('.eq') ? 'equation' : 'code', box: px(r) };
    // A code panel can be much wider than its text (a notebook cell spans the page). Boxing just the text is as good an answer.
    if (piece.kind === 'code') { const q = document.createRange(); q.selectNodeContents(e); piece.text = px(q.getBoundingClientRect()); }
    return piece;
  }));
};
</script>
