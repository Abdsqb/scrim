<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }

  #veil { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at 50% 42%, rgba(6,8,14,.34) 0%, rgba(2,3,6,.88) 80%); }

  .piece.neg { filter: invert(1) grayscale(1) contrast(2.8); mix-blend-mode: screen; }
  .row { position: absolute; display: flex; align-items: baseline; white-space: nowrap; color: #fff; }
  .part { display: inline-block; transform-origin: 50% 60%; }
  .ghost { position: absolute; white-space: nowrap; transform-origin: 0 0; pointer-events: none; }
  .code { position: absolute; font-family: "DejaVu Sans Mono", Consolas, monospace; color: #f2f2f2; white-space: pre; line-height: 1.75; }
  .code .ln { display: block; }
  .code .no { color: #6f7480; display: inline-block; width: 2.2em; }
  .text { position: absolute; color: #eef0f4; font: 26px/1.45 "Segoe UI", "DejaVu Sans", sans-serif; }
  .text p { margin: 0 0 .45em; }
  table.grid { position: absolute; border-collapse: collapse; color: #eef0f4; font-family: "Segoe UI", "DejaVu Sans", sans-serif; }
  .grid td { border-bottom: 1px solid rgba(255,255,255,.16); padding: .35em .9em; white-space: nowrap; }
  .grid tr:first-child td { font-weight: 600; color: #fff; border-bottom-color: rgba(255,255,255,.45); }
  .grid td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .label { position: absolute; font: 600 15px "DejaVu Sans", "Segoe UI", sans-serif; transform: translateX(-50%); white-space: nowrap; opacity: 0; }
  #caption { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font: 23px/1.4 "DejaVu Sans", "Segoe UI", sans-serif; color: #f1f1f1;
             text-shadow: 0 2px 14px rgba(0,0,0,.9); opacity: 0; }
  #ask { position: absolute; left: 50%; top: 54px; transform: translateX(-50%); font: 16px "DejaVu Sans", "Segoe UI", sans-serif; color: #cfd3dc;
         border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 7px 16px; background: rgba(255,255,255,.06); opacity: 0; white-space: nowrap; }
  #ask b { color: #fff; font-weight: 600; }
  body.selecting { cursor: crosshair; }
  #sel { position: absolute; display: none; pointer-events: none; border: 1.5px dashed #fff; background: rgba(88,196,221,.10); box-shadow: 0 0 0 1px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.35); }
  #hint { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); font: 15px "Segoe UI", "DejaVu Sans", sans-serif; color: #e8eaef; white-space: nowrap;
          background: rgba(18,20,26,.88); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 8px 18px; box-shadow: 0 6px 24px rgba(0,0,0,.35); opacity: 0; pointer-events: none; }
  #hint b { color: #fff; font-weight: 600; }
  #hint.asking { pointer-events: auto; padding: 6px 8px 6px 18px; display: flex; align-items: center; gap: 12px; }
  #hint input { width: 520px; background: transparent; border: 0; outline: 0; color: #fff; font: 16px "Segoe UI", "DejaVu Sans", sans-serif; }
  #hint input::placeholder { color: #9aa0ab; }
  #hint small { color: #9aa0ab; font-size: 13px; padding-right: 10px; }
</style>
